<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Masuk Pelayan & Gembala - Layar yang Melayani</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #2b1117 0%, #531824 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            max-width: 420px;
            width: 90%;
            padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .btn-burgundy {
            background-color: #531824;
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            padding: 10px;
            width: 100%;
        }
        .btn-burgundy:hover {
            background-color: #3b111a;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="fs-1 text-danger-emphasis mb-2">†</div>
        <h3 class="fw-bold" style="font-family: 'Playfair Display', serif; color: #2b1117;">Portal Pelayan</h3>
        <p class="text-secondary small mb-4">Akses terbatas khusus Pendeta & Administrator</p>

        <form id="loginForm" onsubmit="prosesLogin(event)">
            <div class="mb-3 text-start">
                <label class="form-label small fw-semibold">Nama / ID Pelayan</label>
                <input type="text" id="username" class="form-control" placeholder="Contoh: Pdt. Samuel / Admin" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label small fw-semibold">Kunci Akses Rahasia</label>
                <input type="password" id="passkey" class="form-control" placeholder="Masukkan kata sandi..." required>
                <div class="form-text" style="font-size: 11px;">*Hanya diberikan kepada mitra pelayan yang bertugas.</div>
            </div>

            <div id="errorMsg" class="alert alert-danger py-2 small d-none" role="alert">
                Akses Ditolak! Kunci rahasia tidak cocok.
            </div>

            <button type="submit" class="btn btn-burgundy mb-3">Buka Ruang Pelayanan</button>
            <a href="janicewebdesign.html" class="text-decoration-none small text-muted">&larr; Kembali ke Beranda</a>
        </form>
    </div>

    <script>
        function prosesLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('passkey').value;
            const errorMsg = document.getElementById('errorMsg');

            // Kata sandi rahasia khusus kamu dan Pendeta
            // Kamu bisa ganti kata sandinya di sini kapan saja:
            if (pass === 'pelayan2026' || pass === 'admin123') {
                sessionStorage.setItem('aksesPelayan', user || 'Pendeta');
                window.location.href = 'dashboard-pdt.html';
            } else {
                errorMsg.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
